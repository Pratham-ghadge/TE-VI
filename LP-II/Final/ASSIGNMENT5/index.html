<!DOCTYPE html>
<html>
<head>
  <title>Simple Chatbot</title>
</head>
<body>

<h3>Simple Chatbot</h3>

<button onclick="toggleChat()">Open Chat</button>

<div id="chat" style="display:none; border:1px solid black; width:300px; height:300px; margin-top:10px; padding:5px;">
  
  <div id="messages" style="height:220px; overflow:auto;"></div>

  <input id="input" placeholder="Type message..." onkeypress="enter(event)">
  <button onclick="send()">Send</button>

</div>

<script>

let chatOpen = false;

/* ---------- FAQ LOGIC ---------- */
const FAQ = [

  { keys: ["hello","hi","name","who"],
    answer: "Hi! I'm Alex Rivera 🤖" },

  { keys: ["age"],
    answer: "I'm 22 years old." },

  { keys: ["location","where"],
    answer: "I'm in Cambridge, USA." },

  { keys: ["email","contact"],
    answer: "Email: alex.rivera@mit.edu" },

  { keys: ["github"],
    answer: "GitHub: github.com/alexrivera" },

  { keys: ["education","study"],
    answer: "I'm studying Computer Science & AI at MIT." },

  { keys: ["gpa"],
    answer: "My GPA is 3.9" },

  { keys: ["skills"],
    answer: "React, Node.js, Python, ML" },

  { keys: ["project"],
    answer: "I built AI and web projects." },

  { keys: ["internship","experience"],
    answer: "I worked at Google DeepMind and Stripe." },

  { keys: ["job","hire"],
    answer: "I'm open to work opportunities." },

  { keys: ["bye"],
    answer: "Goodbye 😊" },

  { keys: [],
    answer: "I don't understand 😅" }
];

/* ---------- FUNCTIONS ---------- */

function toggleChat() {
  chatOpen = !chatOpen;
  document.getElementById("chat").style.display = chatOpen ? "block" : "none";
}

function send() {
  let input = document.getElementById("input");
  let text = input.value.trim();

  if (text === "") return;

  addMessage("You: " + text);
  input.value = "";

  let reply = getReply(text.toLowerCase());
  addMessage("Bot: " + reply);
}

function addMessage(msg) {
  let box = document.getElementById("messages");
  box.innerHTML += "<p>" + msg + "</p>";
  box.scrollTop = box.scrollHeight;
}

function enter(e) {
  if (e.key === "Enter") send();
}

/* ---------- KEYWORD MATCH ---------- */

function getReply(q) {
  for (let i = 0; i < FAQ.length; i++) {
    let item = FAQ[i];

    for (let j = 0; j < item.keys.length; j++) {
      if (q.includes(item.keys[j])) {
        return item.answer;
      }
    }
  }

  return "I don't understand 😅";
}

</script>

</body>
</html>
